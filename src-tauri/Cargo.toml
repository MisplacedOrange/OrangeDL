[package]
name = "orangedl"
version = "1.1.0"
description = "A modern desktop download manager"
authors = ["Roy Lu"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "orangedl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "6"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "process"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Smaller, faster-loading release binary. `panic = "abort"` is intentionally
# not set: a panic in one download task should fail that task, not the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
