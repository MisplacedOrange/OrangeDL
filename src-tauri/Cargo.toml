[package]
name = "orangedl"
version = "1.2.0"
description = "A modern desktop download manager"
authors = ["Roy Lu"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "orangedl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "6"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# crates.io sqlx 0.9.0 still caps libsqlite3-sys at <0.38 (RUSTSEC-2026-0459,
# patched in >=0.39.0). This rev is the upstream 0.9.0 commit that raises the
# cap to <0.40. `runtime-tokio-rustls` was split in 0.9.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "process"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Smaller, faster-loading release binary. `panic = "abort"` is intentionally
# not set: a panic in one download task should fail that task, not the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
