name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0). Defaults to version in package.json."
        required: false

permissions:
  contents: write

jobs:
  # ── Read the version from package.json and bail early if the tag already
  #    exists (i.e. this version was already released).
  check:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and check tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # ── Build the Tauri app and upload the Windows installer + portable exe.
  build-app:
    name: Build app (Windows)
    runs-on: windows-latest
    needs: check
    if: needs.check.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $body = Get-Content "docs/release.md" -Raw
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "OrangeDL v${{ env.VERSION }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Generate checksums for release artifacts
        shell: pwsh
        run: |
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $globs = @(
            "src-tauri/target/release/orangedl.exe",
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi"
          )

          foreach ($glob in $globs) {
            $files = Get-ChildItem -Path $glob -ErrorAction SilentlyContinue
            foreach ($file in $files) {
              $hash      = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
              $assetName = if ($file.Name -ieq "orangedl.exe") { "OrangeDL.exe" } else { $file.Name }
              "$hash  $assetName" | Set-Content "$outDir\$assetName.sha256" -Encoding UTF8
              Copy-Item $file.FullName "$outDir\$assetName" -Force
              Write-Host "Checksum for $($file.Name): $hash"
            }
          }

      - name: Upload portable executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: release-artifacts/OrangeDL.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build the bootstrapper on all three platforms and upload each binary.
  build-bootstrapper:
    name: Build bootstrapper (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: [check, build-app]
    if: needs.check.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset_name: orangedl-bootstrap-linux-x64
            binary_path: bootstrapper/target/release/orangedl-bootstrap
          - platform: windows-latest
            asset_name: orangedl-bootstrap-windows-x64.exe
            binary_path: bootstrapper/target/release/orangedl-bootstrap.exe
          - platform: macos-latest
            asset_name: orangedl-bootstrap-macos
            binary_path: bootstrapper/target/release/orangedl-bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bootstrapper

      - name: Test bootstrapper
        run: cargo test --manifest-path bootstrapper/Cargo.toml --locked

      - name: Bootstrapper clippy
        run: cargo clippy --manifest-path bootstrapper/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build bootstrapper
        run: cargo build --manifest-path bootstrapper/Cargo.toml --release --locked

      - name: Compute bootstrapper checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p bootstrapper-dist
          cp "${{ matrix.binary_path }}" "bootstrapper-dist/${{ matrix.asset_name }}"
          sha256sum "bootstrapper-dist/${{ matrix.asset_name }}" | \
            awk '{print $1 "  ${{ matrix.asset_name }}"}' \
            > "bootstrapper-dist/${{ matrix.asset_name }}.sha256"

      - name: Compute bootstrapper checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bootstrapper-dist | Out-Null
          Copy-Item "${{ matrix.binary_path }}" "bootstrapper-dist/${{ matrix.asset_name }}"
          $hash = (Get-FileHash "bootstrapper-dist/${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Set-Content "bootstrapper-dist/${{ matrix.asset_name }}.sha256" -Encoding UTF8

      - name: Upload bootstrapper to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            bootstrapper-dist/${{ matrix.asset_name }}
            bootstrapper-dist/${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
