name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Builds the frontend dist/ that tauri::generate_context! embeds,
      # and runs tsc as part of the build script.
      - name: Build frontend
        run: npm run build

      - name: Rust format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  bootstrapper:
    name: Bootstrapper (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: bootstrapper

      - name: Bootstrapper clippy
        run: cargo clippy --manifest-path bootstrapper/Cargo.toml --all-targets --locked -- -D warnings

      - name: Bootstrapper tests
        run: cargo test --manifest-path bootstrapper/Cargo.toml --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD

      - name: Cache cargo-audit binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install frontend dependencies
        run: npm ci

      # cargo-audit 0.22 removed --manifest-path. --file still audits the lockfile.
      - name: Rust security audit (app)
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Rust security audit (bootstrapper)
        run: cargo audit --file bootstrapper/Cargo.lock

      # High/critical production advisories fail the job. The full tree is
      # audited too; GHSA-vfj7-8cjw-p6xm (braces) is the only accepted high
      # finding: every published braces release is affected, and it is only
      # reached through tailwindcss 3's build-time file watcher. Tailwind 4
      # drops that chain, but it is a breaking frontend migration.
      - name: npm security audit
        run: |
          npm audit --omit=dev --audit-level=high
          node <<'EOF'
          const {execFileSync} = require("node:child_process");
          let raw = "";
          try {
            raw = execFileSync("npm", ["audit", "--json"], {encoding: "utf8"});
          } catch (error) {
            raw = error.stdout ? error.stdout.toString() : "";
            if (!raw) {
              throw error;
            }
          }
          const report = JSON.parse(raw);
          const allowed = new Set(["GHSA-vfj7-8cjw-p6xm"]);
          const seen = new Set();
          const blocking = [];
          for (const info of Object.values(report.vulnerabilities || {})) {
            for (const via of info.via || []) {
              if (!via || typeof via !== "object") continue;
              if (via.severity !== "high" && via.severity !== "critical") continue;
              const ghsa = String(via.url || "").split("/").pop();
              if (allowed.has(ghsa)) {
                seen.add(ghsa);
                continue;
              }
              blocking.push(`${via.name}: ${ghsa} ${via.title}`);
            }
          }
          if (blocking.length) {
            console.error("High npm advisories outside the documented allowlist:");
            for (const line of blocking) console.error(`- ${line}`);
            process.exit(1);
          }
          for (const id of allowed) {
            if (!seen.has(id)) {
              console.error(`Allowlist entry ${id} is stale; remove it once the advisory is gone.`);
              process.exit(1);
            }
          }
          console.log("npm audit: no undocumented high or critical advisories.");
          EOF
