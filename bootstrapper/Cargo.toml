[package]
name = "orangedl-bootstrap"
version = "0.1.0"
edition = "2021"
description = "Small downloader bootstrapper for OrangeDL release assets"
license = "MIT"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
